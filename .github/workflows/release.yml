name: Release

on:
  push:
    tags:
      - "v*"

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  build-and-publish-binary:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: windows-latest
            platform: win32
            arch: x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build Rust (Release)
        run: |
          cd core
          cargo build --release --locked

      - name: Prepare Package
        shell: bash
        run: |
          # Extract version from tag (v1.0.0 -> 1.0.0)
          VERSION=${GITHUB_REF#refs/tags/v}

          # Run generation script
          bun scripts/build-npm.ts $VERSION ${{ matrix.platform }} ${{ matrix.arch }}

          # Determine binary name and extension based on OS
          if [ "${{ matrix.platform }}" = "win32" ]; then
            EXT="dll"
            PREFIX=""
          elif [ "${{ matrix.platform }}" = "darwin" ]; then
            EXT="dylib"
            PREFIX="lib"
          else
            EXT="so"
            PREFIX="lib"
          fi

          BINARY_NAME="${PREFIX}letui_core.${EXT}"
          SRC="core/target/release/$BINARY_NAME"
          DEST="npm/letui-${{ matrix.platform }}-${{ matrix.arch }}/"

          echo "Copying $SRC to $DEST"
          cp "$SRC" "$DEST"

      - name: Publish Binary Package
        shell: bash
        run: |
          cd npm/letui-${{ matrix.platform }}-${{ matrix.arch }}

          # Setup .npmrc with token
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc

          npm publish --access public

  publish-main:
    needs: build-and-publish-binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Publish Main Package
        run: |
          # Setup .npmrc with token
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc

          # Update version in package.json to match tag
          VERSION=${GITHUB_REF#refs/tags/v}
          npm version $VERSION --no-git-tag-version --allow-same-version

          npm publish --access public
